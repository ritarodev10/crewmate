name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - 'docker/api.Dockerfile'
      - 'fly.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: |
          sleep 15
          curl -f https://crewmate-api.fly.dev/healthz -H "x-cloudflare-secret: ${CF_SECRET}" || exit 1
          curl -f https://crewmate-api.fly.dev/readyz -H "x-cloudflare-secret: ${CF_SECRET}" || exit 1
        env:
          CF_SECRET: ${{ secrets.CLOUDFLARE_SHARED_SECRET }}
